openapi: 3.0.3

info:
  title: Boletos Service API
  description: Boleto issuance, consultation and payment processing
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local development

tags:
  - name: Boletos
    description: Boleto operations

paths:
  /api/v1/boletos:
    post:
      tags: [ Boletos ]
      operationId: createBoleto
      summary: Issue a new boleto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoletoRequest'
      responses:
        '201':
          description: Boleto issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [ Boletos ]
      operationId: listBoletos
      summary: List boletos (paginated)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoPageResponse'

  /api/v1/boletos/{id}:
    get:
      tags: [ Boletos ]
      operationId: findBoletoById
      summary: Find boleto by ID
      parameters:
        - $ref: '#/components/parameters/BoletoId'
      responses:
        '200':
          description: Boleto found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/boletos/{id}/pay:
    post:
      tags: [ Boletos ]
      operationId: payBoleto
      summary: Process boleto payment
      parameters:
        - $ref: '#/components/parameters/BoletoId'
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/boletos/{id}/cancel:
    post:
      tags: [ Boletos ]
      operationId: cancelBoleto
      summary: Cancel a boleto
      parameters:
        - $ref: '#/components/parameters/BoletoId'
      responses:
        '200':
          description: Boleto cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    BoletoId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20

  schemas:
    CreateBoletoRequest:
      type: object
      required: [ payerAccountId, beneficiaryName, amount, dueDate ]
      properties:
        payerAccountId:
          type: string
          format: uuid
        beneficiaryName:
          type: string
          maxLength: 150
          example: "Empresa XPTO Ltda"
        beneficiaryDocument:
          type: string
          example: "12345678000195"
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 350.00
        dueDate:
          type: string
          format: date
          example: "2025-12-31"
        description:
          type: string
          maxLength: 200
          example: "Pagamento fatura 001"

    BoletoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        barCode:
          type: string
          description: Linha digitável do boleto (48 digits)
        payerAccountId:
          type: string
          format: uuid
        beneficiaryName:
          type: string
        amount:
          type: number
          format: double
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BoletoStatus'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time

    BoletoPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BoletoResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean

    BoletoStatus:
      type: string
      enum: [ PENDING, PAID, CANCELLED, OVERDUE ]

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'