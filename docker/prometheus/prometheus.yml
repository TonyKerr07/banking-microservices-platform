global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'accounts-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['accounts-service:8081']

  - job_name: 'transfers-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transfers-service:8082']

  - job_name: 'boletos-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['boletos-service:8083']

  - job_name: 'pix-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pix-service:8084']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']