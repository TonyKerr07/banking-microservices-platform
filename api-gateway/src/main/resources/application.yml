spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "https://*.antonio.com.br"
            allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
            allowedHeaders: [ "*" ]
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        - id: accounts-service
          uri: ${BANKING_ACCOUNTS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accounts-cb
                fallbackUri: forward:/fallback/accounts

        - id: transfers-service
          uri: ${BANKING_TRANSFERS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: CircuitBreaker
              args:
                name: transfers-cb
                fallbackUri: forward:/fallback/transfers

        - id: boletos-service
          uri: ${BANKING_BOLETOS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/boletos/**
          filters:
            - name: CircuitBreaker
              args:
                name: boletos-cb
                fallbackUri: forward:/fallback/boletos

        - id: pix-service
          uri: ${BANKING_PIX_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/pix/**
          filters:
            - name: CircuitBreaker
              args:
                name: pix-cb
                fallbackUri: forward:/fallback/pix

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# ── JWT ──────────────────────────────────────────────────────
banking:
  jwt:
    # Base64-encoded secret — min 256 bits for HS256
    # PRODUCTION: use a strong random secret via environment variable
    # Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET:bXlzdXBlcnNlY3JldGtleWZvcmp3dGJhbmtpbmdtaWNyb3NlcnZpY2VzMjAyNA==}
    expiration: ${JWT_EXPIRATION:86400000}  # 24h in ms
  accounts-service:
    url: ${BANKING_ACCOUNTS_SERVICE_URL:http://localhost:8081}
  transfers-service:
    url: ${BANKING_TRANSFERS_SERVICE_URL:http://localhost:8082}
  boletos-service:
    url: ${BANKING_BOLETOS_SERVICE_URL:http://localhost:8083}
  pix-service:
    url: ${BANKING_PIX_SERVICE_URL:http://localhost:8084}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Accounts Service
        url: ${BANKING_ACCOUNTS_SERVICE_URL:http://localhost:8081}/v3/api-docs
      - name: Transfers Service
        url: ${BANKING_TRANSFERS_SERVICE_URL:http://localhost:8082}/v3/api-docs
      - name: Boletos Service
        url: ${BANKING_BOLETOS_SERVICE_URL:http://localhost:8083}/v3/api-docs
      - name: PIX Service
        url: ${BANKING_PIX_SERVICE_URL:http://localhost:8084}/v3/api-docs

# ── Resilience4j Circuit Breaker ─────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      accounts-cb:
        baseConfig: default
      transfers-cb:
        baseConfig: default
      boletos-cb:
        baseConfig: default
      pix-cb:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      accounts-cb:
        baseConfig: default
      transfers-cb:
        baseConfig: default
      boletos-cb:
        baseConfig: default
      pix-cb:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
    br.com.antonio.banking: DEBUG