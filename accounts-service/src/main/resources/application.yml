spring:
  application:
    name: accounts-service

  # ── H2 (dev profile — default) ───────────────────────────────
  datasource:
    url: jdbc:h2:mem:accounts_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway is responsible — never let Hibernate create tables
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Virtual Threads (Java 21) ─────────────────────────────────
  threads:
    virtual:
      enabled: true

server:
  port: 8081

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── SpringDoc ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    br.com.antonio.banking: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG