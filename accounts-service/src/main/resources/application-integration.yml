spring:
  datasource:
    # URL preenchida dinamicamente pelo Testcontainers via @DynamicPropertySource
    url: will-be-replaced
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

logging:
  level:
    br.com.antonio.banking: DEBUG
    org.flywaydb: INFO